openapi: 3.0.0
info:
  title: DCTD-UTC Commerce API
  description: Contract for storefront and admin applications
  version: 1.0.0
  contact: {}
servers:
  - url: http://localhost:4000
    description: Local
paths:
  /api/v1/content/posts:
    get:
      operationId: listPublishedPosts
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: number
        - name: postType
          required: false
          in: query
          description: Lọc theo loại bài viết. Bỏ trống để lấy tất cả.
          schema:
            $ref: "#/components/schemas/ContentPostType"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPostListDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
      summary: List published content posts (paginated summaries without body)
      tags:
        - Storefront Content
  /api/v1/content/posts/{slug}:
    get:
      operationId: getPublishedPost
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPostDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
      summary: Get a published post by slug
      tags:
        - Storefront Content
  /api/v1/content/banners:
    get:
      description: Chỉ PUBLISHED và trong khung hiệu lực; sắp theo sortOrder, id; tối đa 50 banner, không phân trang.
      operationId: listActiveBanners
      parameters:
        - name: placement
          required: false
          in: query
          description: Bỏ trống = mọi vị trí.
          schema:
            $ref: "#/components/schemas/BannerPlacement"
        - name: categoryId
          required: false
          in: query
          description: Danh mục đang xem; trả banner CATEGORY_TOP của danh mục này và banner áp cho mọi danh mục.
          schema:
            pattern: ^[1-9][0-9]*$
            example: "1"
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveBannerListDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
        "503":
          description: ""
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
      summary: Banner đang hiển thị theo vị trí (và danh mục với CATEGORY_TOP)
      tags:
        - Storefront Content
  /api/v1/newsletter/subscriptions:
    post:
      operationId: createNewsletterSubscription
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNewsletterSubscriptionDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionResultDto"
        "400":
          description: Email/source sai định dạng hoặc honeypot có giá trị
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
        "429":
          description: Burst throttle theo IP
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
        "503":
          description: NEWSLETTER_PERSISTENCE_DISABLED
          content:
            application/json:
              schema:
                $ref: ./_components.yaml#/components/schemas/ErrorResponseDto
      summary: Đăng ký nhận bản tin; gọi lại cùng email trả cùng kết quả, không tạo bản ghi trùng
      tags:
        - Storefront Content
