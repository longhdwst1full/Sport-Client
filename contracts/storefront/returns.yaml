          description: Số tiền còn được hoàn, đã chặn theo cả phiếu và số tiền đã thu
        allowedRefundMethods:
          type: array
          items:
            $ref: "#/components/schemas/RefundMethod"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnItemDto"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/RefundDto"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReturnHistoryDto"
      required:
        - id
        - returnNo
        - orderId
        - orderNo
        - status
        - channel
        - reasonCode
        - recipientName
        - itemCount
        - createdAt
        - version
        - evidenceImages
        - deliveredAt
        - windowOverridden
        - estimatedRefundAmount
        - refundedAmount
        - pendingRefundAmount
        - refundableAmount
        - allowedRefundMethods
        - items
        - refunds
        - history
    ReturnEligibilityDto:
      type: object
      properties:
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        eligible:
          type: boolean
          description: false thì FE tắt nút tạo phiếu và hiển thị reason
        reason:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReturnIneligibleReason"
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        returnDeadline:
          type: string
          format: date-time
          nullable: true
        windowDays:
          type: number
        withinWindow:
          type: boolean
        windowOverrideRequired:
          type: boolean
          description: "Chỉ Admin: quá hạn nhưng tài khoản được override, phải nhập windowOverrideNote"
        openReturnNo:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnEligibilityLineDto"
      required:
        - orderId
        - orderNo
        - eligible
        - windowDays
        - withinWindow
        - windowOverrideRequired
        - items
    ReturnEligibilityLineDto:
      type: object
      properties:
        orderItemId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        imageUrl:
          type: string
          nullable: true
        isBundle:
          type: boolean
          description: "Combo: chỉ được trả đúng returnableQuantity, không trả lẻ"
        purchasedQuantity:
          type: number
        returnedQuantity:
          type: number
          description: Đã nằm trên phiếu khác chưa bị từ chối/huỷ
        returnableQuantity:
          type: number
          description: 0 khi đã trả hết hoặc danh mục không áp dụng đổi trả
        blockedByCategory:
          type: boolean
        unitRefundEstimate:
          type: string
          description: Tiền hoàn ước tính cho 1 sản phẩm (làm tròn xuống)
        maxRefundEstimate:
          type: string
          description: Tiền hoàn ước tính khi trả toàn bộ returnableQuantity
      required:
        - orderItemId
        - sku
        - productName
        - variantName
        - isBundle
        - purchasedQuantity
        - returnedQuantity
        - returnableQuantity
        - blockedByCategory
        - unitRefundEstimate
        - maxRefundEstimate
    ReturnEvidenceImageDto:
      type: object
      properties:
        url:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        width:
          type: number
        height:
          type: number
      required:
        - url
        - thumbnailUrl
        - width
        - height
    ReturnEvidenceInputDto:
      type: object
      properties:
        publicId:
          type: string
          example: sport-sys/sport/return-evidence/o9/8ece7be0-b7da-4ff1-a37e-fdd473b08d5e
        providerVersion:
          type: number
          example: 1787999000
        providerSignature:
          type: string
      required:
        - publicId
        - providerVersion
        - providerSignature
    ReturnFault:
      type: string
      enum:
        - SHOP
        - CUSTOMER
    ReturnHistoryDto:
      type: object
      properties:
        sequenceNo:
          type: number
        action:
          allOf:
            - $ref: "#/components/schemas/ReturnAction"
        fromStatus:
          type: string
          nullable: true
        toStatus:
          allOf:
            - $ref: "#/components/schemas/ReturnStatus"
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - sequenceNo
        - action
        - toStatus
        - createdAt
    ReturnIneligibleReason:
      type: string
      enum:
        - ORDER_NOT_RETURNABLE
        - OPEN_RETURN_EXISTS
        - WINDOW_EXPIRED
        - NOTHING_RETURNABLE
    ReturnItemDisposition:
      type: string
      enum:
        - RESTOCK
        - HOLD
        - WRITE_OFF
    ReturnItemDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderItemId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
        productName:
          type: string
        variantName:
          type: string
        itemType:
          allOf:
            - $ref: "#/components/schemas/OrderItemType"
        quantity:
          type: number
        unitPrice:
          type: string
          example: "350000.00"
        condition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReturnCondition"
        disposition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReturnItemDisposition"
        restockQty:
          type: number
        refundCap:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
      required:
        - id
        - orderItemId
        - sku
        - productName
        - variantName
        - itemType
        - quantity
        - unitPrice
        - restockQty
    ReturnLineInputDto:
      type: object
      properties:
        orderItemId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        quantity:
          type: number
          minimum: 1
          description: Combo phải bằng toàn bộ số bộ còn trả được của dòng
      required:
        - orderItemId
        - quantity
    ReturnListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnSummaryDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    ReturnReasonCode:
      type: string
      enum:
        - DEFECTIVE
        - WRONG_ITEM
        - NOT_AS_DESCRIBED
        - WRONG_SIZE
        - CHANGED_MIND
        - OTHER
    ReturnReasonCommandDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
          example: "0"
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - expectedVersion
        - reason
    ReturnStatus:
      type: string
      enum:
        - REQUESTED
        - APPROVED
        - REJECTED
        - RECEIVED
        - REFUNDED
        - CLOSED
        - CANCELLED
    ReturnSummaryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        returnNo:
          type: string
          example: RMA-20260924-000001
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/ReturnStatus"
        channel:
          allOf:
            - $ref: "#/components/schemas/ReturnChannel"
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/ReturnReasonCode"
        fault:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ReturnFault"
        recipientName:
          type: string
        itemCount:
          type: number
        createdAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - id
        - returnNo
        - orderId
        - orderNo
        - status
        - channel
        - reasonCode
        - recipientName
        - itemCount
        - createdAt
        - version
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
