components:
  schemas:
    CreateAccountReturnDto:
      type: object
      properties:
        reasonCode:
          allOf:
            - $ref: "#/components/schemas/ReturnReasonCode"
        description:
          type: string
          maxLength: 2000
        evidenceImages:
          maxItems: 5
          description: Ảnh minh chứng đã tải lên bằng chữ ký upload của đơn này. Ảnh và mô tả đều không bắt buộc
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceInputDto"
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/ReturnLineInputDto"
        orderNo:
          type: string
          maxLength: 40
          example: ORD-20260924-0001
      required:
        - reasonCode
        - items
        - orderNo
    CreateAccountReturnEvidenceUploadDto:
      type: object
      properties:
        fileName:
          type: string
          example: product-front.webp
        contentType:
          example: image/webp
          allOf:
            - $ref: ./_components.yaml#/components/schemas/ImageMimeType
        sizeBytes:
          type: number
          minimum: 1
          maximum: 10485760
          example: 245760
        orderNo:
          type: string
          maxLength: 40
          example: ORD-20260924-0001
      required:
        - fileName
        - contentType
        - sizeBytes
        - orderNo
    OrderItemType:
      type: string
      enum:
        - STANDARD
        - BUNDLE
    RefundDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        refundNo:
