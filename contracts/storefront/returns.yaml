          nullable: true
        proofImages:
          description: Chứng từ lưu khi xác nhận; không trả cho khách
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceImageDto"
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - id
        - refundNo
        - method
        - amount
        - status
        - proofImages
        - createdAt
        - version
    RefundMethod:
      type: string
      enum:
        - CASH
        - BANK_TRANSFER
    RefundStatus:
      type: string
      enum:
        - PENDING
        - SUCCEEDED
        - FAILED
    ReturnAction:
      type: string
      enum:
        - CREATE
        - APPROVE
        - REJECT
        - CANCEL
        - RECEIVE
        - REFUND_REQUEST
        - REFUND_CONFIRM
        - REFUND_FAIL
        - CLOSE
    ReturnChannel:
      type: string
      enum:
        - ACCOUNT
        - ADMIN
    ReturnCondition:
      type: string
      enum:
        - SELLABLE
        - DAMAGED
        - MISSING
    ReturnDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        returnNo:
          type: string
          example: RMA-20260924-000001
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/ReturnStatus"
        channel:
          allOf:
            - $ref: "#/components/schemas/ReturnChannel"
        reasonCode:
          allOf:
