        decisionNote:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        refundCap:
          type: string
          nullable: true
          description: Trần tiền hoàn, có sau khi nhận hàng
        estimatedRefundAmount:
          type: string
          description: Số tiền hoàn DỰ KIẾN để hiển thị; bằng refundCap sau khi nhận hàng, trước đó là ước tính có thể thay đổi
        refundedAmount:
          type: string
        pendingRefundAmount:
          type: string
        refundableAmount:
