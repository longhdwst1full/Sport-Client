        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutShippingEstimateRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutShippingEstimateDto"
        "409":
          description: CHECKOUT_OUT_OF_STOCK khi cả chuỗi không đủ hàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "422":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Estimate the shipping fee for cart lines and a recipient area (no side effects)
      tags:
        - Storefront Guest Checkout
  /api/v1/checkouts/guest/quote:
    post:
      operationId: quoteGuestCheckout
      parameters:
        - name: x-cart-token
          required: true
          in: header
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutQuoteDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "422":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Revalidate a guest cart and choose an eligible fulfillment branch
      tags:
        - Storefront Guest Checkout
  /api/v1/checkouts/guest/{checkoutToken}:
    get:
      operationId: getGuestCheckoutQuote
      parameters:
        - name: checkoutToken
          required: true
          in: path
          schema:
            type: string
        - name: x-cart-token
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Reload an owned guest quote after staff consultation
      tags:
        - Storefront Guest Checkout
  /api/v1/checkouts/guest/{checkoutToken}/confirm:
    post:
      operationId: confirmGuestCheckout
      parameters:
        - name: checkoutToken
          required: true
          in: path
          schema:
            type: string
        - name: x-cart-token
          required: true
          in: header
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Confirm a guest quote and reserve its physical SKU demand atomically
      tags:
        - Storefront Guest Checkout
  /api/v1/checkouts/guest/reservations/{reservationToken}/release:
    post:
      operationId: releaseGuestReservation
      parameters:
        - name: reservationToken
          required: true
          in: path
          schema:
            type: string
        - name: x-cart-token
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseReservationDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
      summary: Release a guest reservation before fulfillment handover
      tags:
        - Storefront Guest Checkout
  /api/v1/account/checkouts/quote:
    post:
      operationId: quoteAccountCheckout
      parameters:
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutQuoteDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "422":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Revalidate an account cart and choose an eligible fulfillment branch
      tags:
        - Storefront Account Checkout
  /api/v1/account/checkouts/{checkoutToken}:
    get:
      operationId: getAccountCheckoutQuote
      parameters:
        - name: checkoutToken
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Reload an owned account quote after staff consultation
      tags:
        - Storefront Account Checkout
  /api/v1/account/checkouts/{checkoutToken}/confirm:
    post:
      operationId: confirmAccountCheckout
      parameters:
        - name: checkoutToken
          required: true
          in: path
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationDto"
      security:
        - bearer: []
      summary: Confirm an account quote and reserve its physical SKU demand atomically
      tags:
